name: Export offline image for NAS

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release version, for example 2.0.1'
        type: string
        required: true
      source_sha:
        description: 'Full 40-character source commit SHA of the published image'
        type: string
        required: true
      source_digest:
        description: 'Published manifest digest, sha256 followed by 64 hex characters'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: family-library-publish
  cancel-in-progress: false

jobs:
  export:
    if: github.repository == 'Swear1207/family-library' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
    steps:
      - name: Check out export script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to read the existing image
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export and publish verified offline image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPOSITORY: ghcr.io/swear1207/family-library
          SOURCE_REVISION: ${{ inputs.source_sha }}
          SOURCE_DIGEST: ${{ inputs.source_digest }}
          APP_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/export-offline-image.sh
